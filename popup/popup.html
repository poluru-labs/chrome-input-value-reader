<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Value Reader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="mast">
    <div class="mast-mark" aria-hidden="true">IV</div>
    <div class="mast-copy">
      <p class="mast-name">Input Value Reader</p>
      <p class="mast-tag">Load the active page, list every field</p>
    </div>
    <span class="mast-ver">1.1</span>
  </header>

  <main class="panel">
    <p class="field-label">Current page</p>
    <p id="pageUrl" class="page-url" title="">Open a tab, then click Load Page.</p>

    <div class="actions">
      <button type="button" id="loadPage" class="btn btn-primary">Load Page</button>
      <button type="button" id="clearResults" class="btn btn-ghost">Clear</button>
    </div>

    <section class="result" aria-label="Form fields">
      <p class="result-kicker" id="resultKicker">Fields</p>
      <div id="output" class="result-body is-empty" role="status" aria-live="polite">
        <p class="empty-title">Nothing loaded</p>
        <p class="empty-copy">Click Load Page to read every input, textarea, and select on this tab.</p>
      </div>
    </section>
  </main>

  <footer class="foot">
    Poluru Labs · Passwords stay hidden · Nothing leaves this machine
  </footer>

  <script src="popup.js"></script>
</body>
</html>
